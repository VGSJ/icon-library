name: Daily Icon Sync from Figma

on:
  schedule:
    # 9am SGT = 1am UTC (SGT is UTC+8)
    - cron: '0 1 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  sync-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Sync all categories from Figma (includes change detection)
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
        run: |
          categories=(
            "heating ventilation air conditioning"
            "actions & general interface"
            "arrows"
            "power & electrical"
            "nature & landscaping"
            "building & construction"
            "system & technology"
            "document & statistics"
            "editor"
            "media & entertainment"
            "security"
            "transport"
            "furniture & things"
            "light"
            "communication"
            "layout & grid"
            "health & safety"
            "people"
            "geometry"
            "housekeeping"
            "fire"
            "brickschema relationships"
            "time & date"
            "payment & rewards"
            "wayfinding"
            "ai & vr"
            "vertical transport"
            "flags"
          )
          
          for category in "${categories[@]}"; do
            echo "Syncing $category..."
            node scripts/sync-category.mjs "$category" || echo "Warning: Failed to sync $category"
          done
        continue-on-error: true

      - name: Regenerate metadata from Figma
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
        run: node generate-metadata.mjs
        continue-on-error: true

      - name: Commit changes if any
        run: |
          git config user.name "Icon Sync Bot"
          git config user.email "bot@icon-library.local"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync metadata from Figma [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
        continue-on-error: true
